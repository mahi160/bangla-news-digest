name: digest

# No AI summary step anymore (see docs/adr/0004) -- collection is plain
# fetch+extract, no external auth needed. SMTP secrets are still optional;
# a scheduled run here just logs and skips email if EMAIL_TO/SMTP_* aren't
# set. Fetches articles, rebuilds the site/ archive, pushes so pages.yml
# deploys it.
on:
  schedule:
    - cron: "0 0,12 * * *"  # 06:00 and 18:00 Bangladesh time (UTC+6)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write  # to kick off pages.yml below

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/ state.json
          git diff --cached --quiet || git commit -m "digest: $(date -u +%Y-%m-%dT%H:%MZ) (CI)"
          git push
      # pushes made with GITHUB_TOKEN don't trigger other workflows (anti-
      # recursion), so pages.yml's `on: push` won't fire on its own here.
      - run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
