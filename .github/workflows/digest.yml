name: digest (manual)

# Manual-only: pi CLI auth (AI summaries) and SMTP secrets are local-only, so
# a run triggered here always falls back to degraded mode (raw headlines, no
# email) -- see pipeline.py's own fallback handling. Still fetches articles
# and rebuilds the site/ archive, then pushes so pages.yml deploys it.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write  # to kick off pages.yml below

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/ state.json
          git diff --cached --quiet || git commit -m "digest: $(date -u +%Y-%m-%dT%H:%MZ) (CI, degraded)"
          git push
      # pushes made with GITHUB_TOKEN don't trigger other workflows (anti-
      # recursion), so pages.yml's `on: push` won't fire on its own here.
      - run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
