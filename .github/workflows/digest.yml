name: digest

# Single workflow: collect new articles -> (if any) build the static site
# (HTML/feed.xml/opds.xml/EPUBs all generated by `astro build` from what
# collect.ts wrote) -> email the digest -> commit the data files -> deploy
# to Pages. One job, not two -- a commit made with GITHUB_TOKEN doesn't
# trigger other workflows, so splitting collect/deploy across two workflows
# (like the old Python setup) needed an extra cross-trigger step; doing the
# deploy in the same job that already has dist/ built avoids that entirely.
on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # 06:00, 12:00, 18:00, 00:00 Bangladesh time (UTC+6)
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run collect

      - id: changes
        run: |
          git add state.json public/runs.json
          git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - if: steps.changes.outputs.changed == 'true'
        run: npm run send-email
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

      - if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "digest: $(date -u +%Y-%m-%dT%H:%MZ) (CI)"
          git push

      - if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - if: steps.changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
